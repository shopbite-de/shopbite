name: Build quickstart images

# Builds the two images compose.yaml pulls, for amd64 and arm64 (Apple Silicon):
#   ghcr.io/shopbite-de/shopbite-shopware    shopbite-de/shopware (main) with local file storage
#   ghcr.io/shopbite-de/shopbite-storefront  the storefront/ folder with the newest @shopbite-de/storefront 1.x
# Both are published as `candidate` first. The smoke test (test/smoke.mjs) runs the whole stack
# with them and orders a pizza; only then `latest` moves. The storefront image carries the tested
# storefront release in the label de.shopbite.storefront.version, which the lead demos build from.
# The weekly run picks up new storefront releases and the security rebuilds of the base images.

on:
  push:
    branches: [main]
    paths: [shopware/**, storefront/**, setup/**, test/**, compose.yaml, .github/workflows/images.yaml]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/shopbite-de

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      storefront: ${{ steps.version.outputs.storefront }}
    steps:
      - id: version
        run: echo "storefront=$(npm view @shopbite-de/storefront@^1 version | tail -1 | awk '{print $NF}' | tr -d "'")" >> "$GITHUB_OUTPUT"
      - run: echo "Storefront ${{ steps.version.outputs.storefront }}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        image: [shopware, storefront]
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out shopbite-de/shopware
        if: matrix.image == 'shopware'
        uses: actions/checkout@v7
        with:
          repository: shopbite-de/shopware
          path: shopware-src

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          build-contexts: ${{ matrix.image == 'shopware' && 'shopware=shopware-src' || '' }}
          build-args: ${{ matrix.image == 'storefront' && format('STOREFRONT_VERSION={0}', needs.resolve.outputs.storefront) || '' }}
          platforms: ${{ matrix.platform }}
          pull: true
          # links the package to this repository (and its visibility settings)
          labels: |
            org.opencontainers.image.source=https://github.com/shopbite-de/shopbite
            org.opencontainers.image.description=ShopBite quickstart image (${{ matrix.image }})
            de.shopbite.storefront.version=${{ needs.resolve.outputs.storefront }}
          outputs: type=image,name=${{ env.REGISTRY }}/shopbite-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ runner.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: /tmp/digests/*
          retention-days: 1

  candidate:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [shopware, storefront]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image as candidate
        working-directory: /tmp/digests
        run: |
          image=$REGISTRY/shopbite-${{ matrix.image }}
          docker buildx imagetools create -t "$image:candidate" $(printf "$image@sha256:%s " *)

  smoke:
    needs: [resolve, candidate]
    runs-on: ubuntu-24.04
    env:
      SHOPWARE_IMAGE: ghcr.io/shopbite-de/shopbite-shopware:candidate
      STOREFRONT_IMAGE: ghcr.io/shopbite-de/shopbite-storefront:candidate
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack
        run: |
          docker compose pull --quiet
          docker compose up -d
          timeout 600 bash -c 'until curl -sf -o /dev/null http://localhost:3000/; do sleep 5; done'
          docker compose ps -a

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test (storefront ${{ needs.resolve.outputs.storefront }})
        working-directory: test
        env:
          SMOKE_SCREENSHOTS: ${{ runner.temp }}/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Logs
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/smoke"
          docker compose logs --no-color > "${{ runner.temp }}/smoke/compose.log" 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke
          retention-days: 7

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [shopware, storefront]
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest to the tested candidate
        run: |
          image=$REGISTRY/shopbite-${{ matrix.image }}
          docker buildx imagetools create -t "$image:latest" -t "$image:$(date -u +%Y%m%d)" "$image:candidate"
          docker buildx imagetools inspect "$image:latest"
