# Builds the Shopware image from source instead of pulling it (takes 10 to 20 minutes).
# The storefront is built from ./storefront with `--build` anyway.
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Set SHOPWARE_REF to build a branch or tag of shopbite-de/shopware.
services:
  init:
    build: &shopware-build
      context: ./shopware
      additional_contexts:
        shopware: https://github.com/shopbite-de/shopware.git#${SHOPWARE_REF:-main}
  shopware:
    build: *shopware-build
  worker:
    build: *shopware-build
  scheduler:
    build: *shopware-build
