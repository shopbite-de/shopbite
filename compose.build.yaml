# Builds both images from source instead of pulling them (takes 10 to 20 minutes):
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Set SHOPWARE_REF / STOREFRONT_REF to build a branch or tag, e.g. STOREFRONT_REF=v1.29.0.
services:
  init:
    build: &shopware-build
      context: ./shopware
      additional_contexts:
        shopware: https://github.com/shopbite-de/shopware.git#${SHOPWARE_REF:-main}
  shopware:
    build: *shopware-build
  worker:
    build: *shopware-build
  scheduler:
    build: *shopware-build
  storefront:
    build:
      context: https://github.com/shopbite-de/storefront.git#${STOREFRONT_REF:-main}
      dockerfile: node.dockerfile
